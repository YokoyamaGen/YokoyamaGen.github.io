Include stylesheet
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.0-beta.0/dist/quill.bubble.css" rel="stylesheet" />

<!-- Create the editor container -->
<div id="editor">
  <p>Hello World!</p>
  <p>Some initial <strong>bold</strong> text</p>
  <p><br /></p>
</div>

<!-- Create the bold button -->
<button id="bold-button">Bold</button>

<!-- Include the Quill library -->
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.0-beta.0/dist/quill.js"></script>

<!-- Initialize Quill editor -->
<script>
  const quill = new Quill('#editor', {
    theme: 'bubble'
  });

  // Add an event listener to the button
  document.getElementById('bold-button').addEventListener('click', function() {

    const test = quill.root.scrollTop;
    console.log(test)

    const currentSelection = quill.getSelection();
    if (currentSelection) {
      // Toggle bold formatting on the selected text
      const isBold = quill.getFormat(currentSelection).bold;
      quill.format('bold', !isBold);
    }
  });
</script>
